name: Publicar wiki en GitHub Pages

# Cada push a main reconstruye la wiki y la publica.
# Los pull requests solo comprueban que compila y que no hay enlaces rotos (no publican).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega otro push, cancela la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la wiki y comprobar enlaces
        run: python3 build.py --check

      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
